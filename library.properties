name=shark_pid
version=1.0.0
author=Tran Nguyen Binh <trannguyenbinh.shark@gmail.com>
maintainer=Tran Nguyen Binh <trannguyenbinh.shark@gmail.com>
sentence=Sample-rate independent embedded PID controller with a portable C99 core.
paragraph=Explicit dt in every term so gains survive a change of loop rate. Setpoint weighting (2-DOF), feedforward, conditional-integration and back-calculation anti-windup, dt-aware derivative and output filters, slew-rate limiting, deadband, time-based recoverable stall detection, NaN/Inf rejection and bumpless manual-to-auto transfer. The core has no Arduino or HAL dependency, so the same file builds for STM32, ESP-IDF or a PC simulation.
category=Signal Input/Output
